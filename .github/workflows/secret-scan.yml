name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full history and tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          package="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$package" "$base/$package"
          curl --fail --silent --show-error --location --output checksums.txt "$base/gitleaks_${version}_checksums.txt"
          grep "  ${package}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$package" gitleaks
      - name: Verify detection and redaction using synthetic fixtures
        run: python3 scripts/test_repository_secret_scan.py --gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Scan without exposing matched values
        run: python3 scripts/scan_repository_secrets.py --gitleaks "$RUNNER_TEMP/gitleaks" --report "$RUNNER_TEMP/secret-scan-summary.json"
