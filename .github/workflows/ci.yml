name: CI

on:
  push:
    branches: [main, codex/real-integration-layer]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend
          pip install pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Compile check (app/)
        working-directory: backend
        run: python -m compileall -q app
      - name: Run tests (isolated temp SQLite, no external services)
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run
      - name: Type check and production build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
