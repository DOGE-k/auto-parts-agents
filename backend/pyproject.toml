[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-parts-agents"
version = "0.1.0"
description = "Local mock runtime for a four-agent automotive parts collaboration platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "websockets>=12,<16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
